name: bogazici_barter
description: Türkiye'nin ilk akıllı barter platformu - Boğaziçi Barter

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Core
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  get_it: ^7.6.4
  injectable: ^2.3.2
  dartz: ^0.10.1

  # Network
  dio: ^5.4.0
  retrofit: ^4.0.3
  pretty_dio_logger: ^1.3.1
  connectivity_plus: ^5.0.2

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.7.0
  firebase_crashlytics: ^3.4.0
  firebase_analytics: ^10.8.0
  flutter_local_notifications: ^17.0.0
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  url_launcher: ^6.2.0
  http: ^1.1.0

  # UI/UX
  flutter_screenutil: ^5.9.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.0.0
  animate_do: ^3.0.0
  flutter_slidable: ^3.0.1
  flutter_svg: ^2.0.9
  photo_view: ^0.14.0
  image_picker: ^1.0.4
  # image_cropper: ^5.0.1  # Temporarily commented for build

  # Forms & Validation
  # flutter_form_builder: ^9.1.1  # Commented due to intl version conflict
  # form_builder_validators: ^9.1.0  # Commented due to intl version conflict
  mask_text_input_formatter: ^2.7.0

  # Payment SDKs
  # iyzico_flutter: ^1.0.0 # custom package - commented for build
  # papara_sdk: ^1.0.0 # custom package - commented for build
  # tosla_payment: ^1.0.0 # custom package - commented for build
  # paytr_flutter: ^1.0.0 # custom package - commented for build

  # Localization
  easy_localization: ^3.0.3
  intl: ^0.20.2


dev_dependencies:
  analyzer: ^6.11.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  retrofit_generator: ^8.0.6
  injectable_generator: ^2.4.1
  hive_generator: ^2.0.1
  mockito: ^5.4.3
  bloc_test: ^9.1.5
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/translations/

