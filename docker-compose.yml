version: '3.8'

services:
  # Flutter Web Development Server
  flutter-web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:80"
    volumes:
      - .:/app
      - /app/build
    environment:
      - ENVIRONMENT=development
    networks:
      - app-network
    profiles:
      - web

  # Firebase Emulator Suite
  firebase-emulator:
    image: andreysenov/firebase-tools:latest
    ports:
      - "4000:4000"  # Firestore Emulator
      - "5001:5001"  # Authentication Emulator
      - "8085:8085"  # Hosting Emulator
      - "5000:5000"  # Functions Emulator
      - "8080:8080"  # Realtime Database Emulator
      - "9199:9199"  # Storage Emulator
    volumes:
      - .:/app
      - firebase-data:/opt/firebase/data
    environment:
      - FIREBASE_PROJECT_ID=bogazici-barter-app-dev
    working_dir: /app
    command: firebase emulators:start --project=bogazici-barter-app-dev
    networks:
      - app-network
    profiles:
      - emulator

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=bogazici_barter
      - POSTGRES_USER=barter_user
      - POSTGRES_PASSWORD=barter_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network
    profiles:
      - database

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - app-network
    profiles:
      - cache

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/ssl
      - nginx-logs:/var/log/nginx
    depends_on:
      - flutter-web
    networks:
      - app-network
    profiles:
      - load-balancer

  # Monitoring
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - app-network
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - app-network
    profiles:
      - monitoring

  # Testing
  flutter-test:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - .:/app
    environment:
      - ENVIRONMENT=test
    networks:
      - app-network
    profiles:
      - test

volumes:
  postgres-data:
  redis-data:
  firebase-data:
  prometheus-data:
  grafana-data:
  nginx-logs:

networks:
  app-network:
    driver: bridge
